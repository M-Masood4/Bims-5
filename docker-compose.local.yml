services:
  db:
    image: postgis/postgis
    platform: linux/amd64
    container_name: bims5-db
    environment:
      POSTGRES_DB: bims5
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - bims5_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U admin -d bims5 -c 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  nats:
    build:
      context: .
      dockerfile: docker/Dockerfile.nats
    container_name: bims5-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - bims5_nats_data:/data/jetstream

  map-data:
    build:
      context: .
      dockerfile: docker/Dockerfile.map-data
    container_name: bims5-map-data
    environment:
      DATABASE_URL: "postgresql+asyncpg://admin:admin@db:5432/bims5"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.be
    container_name: bims5-be
    environment:
      DATABASE_URL: "postgresql+asyncpg://admin:admin@db:5432/bims5"
      NATS_URL: "nats://nats:4222"
      SIMENGINE_URL: "http://simengine:8080"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  simengine:
    build:
      context: .
      dockerfile: docker/Dockerfile.simengine
    container_name: bims5-simengine
    environment:
      NATS_URL: "nats://nats:4222"
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.fe
    container_name: bims5-fe
    env_file:
      - trafficjam-fe/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
  worldmove:
    build:
      context: .
      dockerfile: docker/Dockerfile.worldmove
    container_name: bims5-worldmove
    environment:
      NATS_URL: "nats://nats:4222"
      DATA_DIR: "/data"
    ports:
      - "8002:8002"
    volumes:
      - ./worldmove-sim/data:/data
    depends_on:
      nats:
        condition: service_healthy

  ai-logic:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: bims5-ai
    env_file:
      - .env
    environment:
      GEMINI_MODEL: "gemini-2.0-flash"
    ports:
      - "8003:8003"

volumes:
  bims5_db_data:
  bims5_nats_data:
