services:
  nats:
    build:
      context: .
      dockerfile: docker/Dockerfile.nats
    container_name: bims5-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - bims5_nats_data:/data/jetstream

  map-data:
    build:
      context: .
      dockerfile: docker/Dockerfile.map-data
    container_name: bims5-map-data
    environment:
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "8100:8000" # changed host port to avoid Coolify collision

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.be
    container_name: bims5-be
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      NATS_URL: "nats://nats:4222"
      SIMENGINE_URL: "http://simengine:8080"
      AI_SERVICE_URL: "http://ai-logic:8003"
    ports:
      - "8001:8001"
    depends_on:
      nats:
        condition: service_healthy

  simengine:
    build:
      context: .
      dockerfile: docker/Dockerfile.simengine
    container_name: bims5-simengine
    environment:
      NATS_URL: "nats://nats:4222"
    ports:
      - "8180:8080" # changed host port to avoid Traefik collision
    depends_on:
      nats:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.fe
      args:
        NODE_ENV: production
    container_name: bims5-fe
    environment:
      NODE_ENV: production
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - map-data

  worldmove:
    build:
      context: .
      dockerfile: docker/Dockerfile.worldmove
    container_name: bims5-worldmove
    environment:
      NATS_URL: "nats://nats:4222"
      DATA_DIR: "/data"
    ports:
      - "8002:8002"
    volumes:
      - ./worldmove-sim/data:/data
    depends_on:
      nats:
        condition: service_healthy

  ai-logic:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: bims5-ai
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "gemini-2.0-flash"
    ports:
      - "8003:8003"

volumes:
  bims5_db_data:
  bims5_nats_data:
